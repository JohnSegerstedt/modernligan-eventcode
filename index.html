<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modernligan - Event Code</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      width: calc(100% - 40px);
      max-width: 420px;
      box-sizing: border-box;
      padding: 32px 24px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.5;
    }

    .event-date {
      margin-bottom: 28px;
    }

    .event-date-label {
      margin-bottom: 6px;
      color: #777;
      font-size: 13px;
    }

    .event-date-value {
      font-size: 20px;
      font-weight: 600;
    }

    .today-date {
      margin-top: 6px;
      color: #777;
      font-size: 13px;
    }

    .open-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px 20px;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .open-button:hover {
      background: #0d63d8;
    }

    .open-button:active {
      transform: scale(0.98);
    }

    .code-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e5;
    }

    .code-label {
      margin-bottom: 8px;
      color: #777;
      font-size: 13px;
    }

    .code-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .code {
      padding: 8px 10px;
      border-radius: 7px;
      background: #f1f1f1;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .copy-button {
      padding: 8px 11px;
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      background: white;
      color: #333;
      font-size: 13px;
      cursor: pointer;
    }

    .copy-button:hover {
      background: #f5f5f5;
    }

    .copy-message {
      min-height: 18px;
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Modernligan - Event Code</h1>

    <p class="description">
      A dynamic site for the Companion event code
    </p>

    <div class="event-date">

      <div class="event-date-label">
        Event date
      </div>

      <div
        id="eventDate"
        class="event-date-value"
      >
        Loading...
      </div>

      <div
        id="todayDate"
        class="today-date"
      >
        Loading...
      </div>

    </div>

    <a
      id="openAppButton"
      class="open-button"
      href="#"
    >
      Loading...
    </a>

    <div class="code-section">

      <div class="code-label">
        Raw event code
      </div>

      <div class="code-row">

        <span
          id="eventCode"
          class="code"
        >
          Loading...
        </span>

        <button
          id="copyButton"
          class="copy-button"
          type="button"
        >
          Copy
        </button>

      </div>

      <div
        id="copyMessage"
        class="copy-message"
      ></div>

    </div>

  </main>


  <script>

    // ============================================================
    // EVENT CODES
    // ============================================================

    const codes = [
      { end: "2026-09-01", code: "RZGRP3Q" },
      { end: "2026-09-08", code: "2PEV74W" },
      { end: "2026-09-15", code: "QMZRNJN" },
      { end: "2026-09-22", code: "DWV63G4" },
      { end: "2026-09-29", code: "4ZJ67XX" },
      { end: "2026-10-06", code: "GX6NP4Q" },
      { end: "2026-10-13", code: "NMNRJWP" },
      { end: "2026-10-20", code: "PP8R6VY" },
      { end: "2026-10-27", code: "86GZ2XG" },
      { end: "2026-11-03", code: "ZQ7V3YZ" },
      { end: "2026-11-10", code: "YE5VJZR" },
      { end: "2026-11-17", code: "W23YEPX" },
      { end: "2026-11-24", code: "7G587NE" },
      { end: "2026-12-01", code: "M72RVZ7" }
    ];


    // ============================================================
    // GET PAGE ELEMENTS
    // ============================================================

    const eventDateElement =
      document.getElementById("eventDate");

    const todayDateElement =
      document.getElementById("todayDate");

    const eventCodeElement =
      document.getElementById("eventCode");

    const openAppButton =
      document.getElementById("openAppButton");

    const copyButton =
      document.getElementById("copyButton");

    const copyMessage =
      document.getElementById("copyMessage");


    // ============================================================
    // DATE FORMATTING
    // ============================================================

    function formatDateWithDay(date) {

      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1).padStart(2, "0");

      const day =
        String(date.getDate()).padStart(2, "0");

      const dayName =
        date.toLocaleDateString(
          undefined,
          {
            weekday: "long"
          }
        );

      return `${year}-${month}-${day}, ${dayName}`;
    }


    // ============================================================
    // DETERMINE TODAY'S DATE IN UTC
    // ============================================================

    const now = new Date();

    const todayUTC =
      new Date(
        Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate()
        )
      );


    // ============================================================
    // DISPLAY TODAY'S DATE
    // ============================================================

    todayDateElement.textContent =
      "Today is: " +
      formatDateWithDay(
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        )
      );


    // ============================================================
    // FIND THE CURRENT EVENT
    // ============================================================

    let selectedEntry = null;

    for (const entry of codes) {

      const endDate =
        new Date(
          entry.end + "T23:59:59Z"
        );

      if (todayUTC <= endDate) {

        selectedEntry = entry;

        break;
      }
    }


    // ============================================================
    // DISPLAY THE EVENT
    // ============================================================

    if (selectedEntry) {

      const code =
        selectedEntry.code;

      const eventEndDate =
        selectedEntry.end;


      // ----------------------------------------------------------
      // Create destination URL
      // ----------------------------------------------------------

      const destination =
        "https://magic.wizards.com/en/products/companion-app?shortCode=" +
        encodeURIComponent(code);


      // ----------------------------------------------------------
      // Set button destination and text
      // ----------------------------------------------------------

      openAppButton.href =
        destination;

      openAppButton.textContent =
        "Join " + code + " in the Companion App";


      // ----------------------------------------------------------
      // Display event code
      // ----------------------------------------------------------

      eventCodeElement.textContent =
        code;


      // ----------------------------------------------------------
      // Display event date
      // ----------------------------------------------------------

      const dateParts =
        eventEndDate.split("-");

      const year =
        Number(dateParts[0]);

      const month =
        Number(dateParts[1]);

      const day =
        Number(dateParts[2]);


      const displayDate =
        new Date(
          year,
          month - 1,
          day
        );


      eventDateElement.textContent =
        formatDateWithDay(
          displayDate
        );


      // ----------------------------------------------------------
      // Copy button
      // ----------------------------------------------------------

      copyButton.addEventListener(
        "click",
        async function () {

          try {

            await navigator.clipboard.writeText(
              code
            );

            copyButton.textContent =
              "Copied!";

            copyMessage.textContent =
              "Event code copied.";

            setTimeout(
              function () {

                copyButton.textContent =
                  "Copy";

                copyMessage.textContent =
                  "";

              },
              2000
            );

          } catch (error) {

            // Fallback for older browsers

            const textarea =
              document.createElement("textarea");

            textarea.value =
              code;

            textarea.style.position =
              "fixed";

            textarea.style.left =
              "-9999px";

            document.body.appendChild(
              textarea
            );

            textarea.focus();
            textarea.select();

            try {

              document.execCommand(
                "copy"
              );

              copyButton.textContent =
                "Copied!";

              copyMessage.textContent =
                "Event code copied.";

              setTimeout(
                function () {

                  copyButton.textContent =
                    "Copy";

                  copyMessage.textContent =
                    "";

                },
                2000
              );

            } catch (fallbackError) {

              copyMessage.textContent =
                "Copy failed. Please copy the code manually.";

            }

            document.body.removeChild(
              textarea
            );
          }

        }
      );


    } else {

      // ==========================================================
      // NO EVENT
      // ==========================================================

      eventDateElement.textContent =
        "No event configured";

      eventCodeElement.textContent =
        "—";

      openAppButton.style.display =
        "none";

      copyButton.style.display =
        "none";

      copyMessage.textContent =
        "No event code is configured for today.";

      copyMessage.classList.add(
        "error"
      );
    }

  </script>

</body>
</html>
